name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.17.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Checkout public LDS package source
        uses: actions/checkout@v7.0.0
        with:
          repository: LK-Design-System/lk-design-system
          ref: b27be6598a33cd68951c73653ce55109fea45ca0
          path: .lds-package-source

      - name: Build public LDS packages
        working-directory: .lds-package-source
        run: |
          npm ci
          npm run build:workspaces

      - name: Pack public LDS packages
        run: |
          for package in core product theme; do
            (cd ".lds-package-source/packages/$package" && npm pack --pack-destination "$GITHUB_WORKSPACE")
          done

      - name: Install dependencies
        run: |
          cp apps/docs/package.json "$RUNNER_TEMP/lds3d-docs-package.json"
          cp pnpm-workspace.yaml "$RUNNER_TEMP/lds3d-pnpm-workspace.yaml"
          cp pnpm-lock.yaml "$RUNNER_TEMP/lds3d-pnpm-lock.yaml"
          node <<'NODE'
          const fs = require('node:fs');
          const manifestPath = 'apps/docs/package.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const overrides = [];
          fs.mkdirSync('apps/docs/vendor', { recursive: true });
          for (const pkg of ['core', 'product', 'theme']) {
            const name = `@lk-design-system/lds-${pkg}`;
            const tarball = fs
              .readdirSync('.')
              .filter((file) => file.startsWith(`lk-design-system-lds-${pkg}-`) && file.endsWith('.tgz'))
              .sort()[0];
            if (!tarball) {
              throw new Error(`The public LDS ${pkg} package could not be packed.`);
            }
            if (!Object.hasOwn(manifest.dependencies ?? {}, name)) {
              throw new Error(`apps/docs/package.json does not depend on ${name}.`);
            }
            manifest.dependencies[name] = `file:../../${tarball}`;
            fs.copyFileSync(tarball, `apps/docs/vendor/${tarball}`);
            overrides.push(`  "${name}": "file:./${tarball}"`);
          }
          fs.appendFileSync('pnpm-workspace.yaml', `\noverrides:\n${overrides.join('\n')}\n`);
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          pnpm install --lockfile=false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build workspace packages
        run: pnpm build

      - name: Build Storybook
        run: |
          ./node_modules/.bin/storybook build --config-dir apps/docs/.storybook --output-dir storybook-static
          node scripts/check-storybook.mjs

      - name: Restore release manifests
        run: |
          cp "$RUNNER_TEMP/lds3d-docs-package.json" apps/docs/package.json
          cp "$RUNNER_TEMP/lds3d-pnpm-workspace.yaml" pnpm-workspace.yaml
          cp "$RUNNER_TEMP/lds3d-pnpm-lock.yaml" pnpm-lock.yaml

      - name: Validate LDS conformance
        env:
          LDS_CONFORMANCE_CLI: ${{ github.workspace }}/.lds-package-source/packages/conformance/src/cli.mjs
          LDS_CONFORMANCE_ROOT: ${{ github.workspace }}/.lds-package-source
        run: node scripts/check-lds-style.mjs --storybook-index storybook-static/index.json --require-built-stories

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
