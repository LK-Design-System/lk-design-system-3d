name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.17.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Checkout public LDS package source
        uses: actions/checkout@v7.0.0
        with:
          repository: LK-Design-System/lk-design-system
          ref: 10a99516143eaba79ae13a5375f138fbc8c0f993
          path: .lds-package-source

      - name: Build public LDS packages
        working-directory: .lds-package-source
        run: |
          npm.cmd ci
          npm.cmd run build:workspaces

      - name: Pack public LDS packages
        shell: pwsh
        run: |
          foreach ($package in 'core', 'product', 'theme') {
            Push-Location ".lds-package-source/packages/$package"
            npm.cmd pack --pack-destination "$env:GITHUB_WORKSPACE"
            Pop-Location
          }
          Copy-Item .lds-package-source/vendor/lk-robotics-lds-robotics-ui-0.1.0-rc.2.tgz .

      - name: Install dependencies
        shell: pwsh
        run: |
          $manifestBackup = Join-Path $env:RUNNER_TEMP 'lds3d-docs-package.json'
          $workspaceConfigBackup = Join-Path $env:RUNNER_TEMP 'lds3d-pnpm-workspace.yaml'
          $lockfileBackup = Join-Path $env:RUNNER_TEMP 'lds3d-pnpm-lock.yaml'
          Copy-Item apps/docs/package.json $manifestBackup
          Copy-Item pnpm-workspace.yaml $workspaceConfigBackup
          Copy-Item pnpm-lock.yaml $lockfileBackup
          $manifest = Get-Content -Raw apps/docs/package.json | ConvertFrom-Json
          $overrides = [ordered]@{}
          New-Item -ItemType Directory -Force apps/docs/vendor | Out-Null
          foreach ($package in 'core', 'product', 'theme') {
            $tarball = Get-ChildItem -Filter "lk-robotics-lds-$package-*.tgz" | Select-Object -First 1
            if (-not $tarball) {
              throw "The public LDS $package package could not be packed."
            }
            $manifest.dependencies."@lk-robotics/lds-$package" = "file:../../$($tarball.Name)"
            Copy-Item $tarball.FullName "apps/docs/vendor/$($tarball.Name)" -Force
            $overrides."@lk-robotics/lds-$package" = "file:./$($tarball.Name)"
          }
          $roboticsTarball = Get-ChildItem -Filter 'lk-robotics-lds-robotics-ui-*.tgz' | Select-Object -First 1
          if (-not $roboticsTarball) {
            throw 'The public Robotics UI package could not be packed.'
          }
          $manifest.dependencies.'@lk-robotics/lds-robotics-ui' = "file:../../$($roboticsTarball.Name)"
          $overrides.'@lk-robotics/lds-robotics-ui' = "file:./$($roboticsTarball.Name)"
          $overrideYaml = "`noverrides:`n"
          foreach ($entry in $overrides.GetEnumerator()) {
            $overrideYaml += "  `"$($entry.Key)`": `"$($entry.Value)`"`n"
          }
          Add-Content -Path pnpm-workspace.yaml -Value $overrideYaml
          $manifest | ConvertTo-Json -Depth 100 | Set-Content apps/docs/package.json
          pnpm install --lockfile=false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build workspace packages
        run: pnpm build

      - name: Build Storybook
        shell: pwsh
        run: |
          & .\node_modules\.bin\storybook.cmd build --config-dir apps/docs/.storybook --output-dir storybook-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-storybook.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore release manifests
        shell: pwsh
        run: |
          Copy-Item (Join-Path $env:RUNNER_TEMP 'lds3d-docs-package.json') apps/docs/package.json -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'lds3d-pnpm-workspace.yaml') pnpm-workspace.yaml -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'lds3d-pnpm-lock.yaml') pnpm-lock.yaml -Force

      - name: Validate LDS conformance
        env:
          LDS_CONFORMANCE_CLI: ${{ github.workspace }}/.lds-package-source/packages/conformance/src/cli.mjs
          LDS_CONFORMANCE_ROOT: ${{ github.workspace }}/.lds-package-source
        run: node scripts/check-lds-style.mjs --storybook-index storybook-static/index.json --require-built-stories

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
