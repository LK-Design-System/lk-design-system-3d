name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test, Storybook, and package checks
    # A clean Linux checkout preserves the repository's committed LF endings,
    # so the format gate is independent of a contributor's Windows autocrlf
    # setting. The hosted image also includes Chrome for the WebGL runtime QA.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: lk-design-system-3d

    steps:
      - name: Checkout LDS3D
        uses: actions/checkout@v7.0.0
        with:
          path: lk-design-system-3d
          persist-credentials: false

      - name: Run pinned LDS conformance
        id: lds_conformance
        uses: LK-Design-System/lk-design-system/.github/actions/lds-conformance@e37372d2660b4ac76dcd6ea4fda40dbdc6378b93
        with:
          profile: lds3d-ui
          root: lk-design-system-3d

      - name: Export pinned LDS conformance paths
        env:
          CONFORMANCE_CLI: ${{ steps.lds_conformance.outputs.cli }}
          CONFORMANCE_ROOT: ${{ steps.lds_conformance.outputs.lds_root }}
        run: |
          "LDS_CONFORMANCE_CLI=$env:CONFORMANCE_CLI" >> $env:GITHUB_ENV
          "LDS_CONFORMANCE_ROOT=$env:CONFORMANCE_ROOT" >> $env:GITHUB_ENV

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.17.1
          cache: pnpm
          cache-dependency-path: lk-design-system-3d/pnpm-lock.yaml

      - name: Checkout public LDS package source
        uses: actions/checkout@v7.0.0
        with:
          repository: LK-Design-System/lk-design-system
          ref: a9ac5fc15bb2be0d6300c7029807ca393f223496
          path: lk-design-system-source

      - name: Build public LDS packages
        working-directory: lk-design-system-source
        run: |
          npm ci
          npm run build:workspaces

      - name: Checkout public Robotics package source
        uses: actions/checkout@v7.0.0
        with:
          repository: LK-Design-System/lk-design-system-robotics
          ref: 870d2ff5d1c1c10ddf3489f07b3129f975e1a885
          path: lk-design-system-robotics-source

      - name: Build public Robotics package
        working-directory: lk-design-system-robotics-source
        run: |
          npm ci
          npm run build

      - name: Pack public LDS packages
        run: |
          foreach ($package in 'core', 'product', 'theme') {
            Push-Location "../lk-design-system-source/packages/$package"
            npm pack --pack-destination "$env:GITHUB_WORKSPACE/lk-design-system-3d"
            Pop-Location
          }
          Push-Location ../lk-design-system-robotics-source
          npm pack --pack-destination "$env:GITHUB_WORKSPACE/lk-design-system-3d"
          Pop-Location

      - name: Install dependencies
        run: |
          $manifestBackup = Join-Path $env:RUNNER_TEMP 'lds3d-docs-package.json'
          $workspaceConfigBackup = Join-Path $env:RUNNER_TEMP 'lds3d-pnpm-workspace.yaml'
          $lockfileBackup = Join-Path $env:RUNNER_TEMP 'lds3d-pnpm-lock.yaml'
          Copy-Item apps/docs/package.json $manifestBackup
          Copy-Item pnpm-workspace.yaml $workspaceConfigBackup
          Copy-Item pnpm-lock.yaml $lockfileBackup
          $manifest = Get-Content -Raw apps/docs/package.json | ConvertFrom-Json
          $overrides = [ordered]@{}
          New-Item -ItemType Directory -Force apps/docs/vendor | Out-Null
          foreach ($package in 'core', 'product', 'theme') {
            $tarball = Get-ChildItem -Filter "lk-robotics-lds-$package-*.tgz" | Select-Object -First 1
            if (-not $tarball) {
              throw "The public LDS $package package could not be packed."
            }
            $manifest.dependencies."@lk-robotics/lds-$package" = "file:../../$($tarball.Name)"
            Copy-Item $tarball.FullName "apps/docs/vendor/$($tarball.Name)" -Force
            $overrides."@lk-robotics/lds-$package" = "file:./$($tarball.Name)"
          }
          $roboticsTarball = Get-ChildItem -Filter 'lk-robotics-lds-robotics-ui-*.tgz' | Select-Object -First 1
          if (-not $roboticsTarball) {
            throw 'The public Robotics UI package could not be packed.'
          }
          $manifest.dependencies.'@lk-robotics/lds-robotics-ui' = "file:../../$($roboticsTarball.Name)"
          $overrides.'@lk-robotics/lds-robotics-ui' = "file:./$($roboticsTarball.Name)"
          $overrideYaml = "`noverrides:`n"
          foreach ($entry in $overrides.GetEnumerator()) {
            $overrideYaml += "  `"$($entry.Key)`": `"$($entry.Value)`"`n"
          }
          Add-Content -Path pnpm-workspace.yaml -Value $overrideYaml
          $manifest | ConvertTo-Json -Depth 100 | Set-Content apps/docs/package.json
          pnpm install --lockfile=false
          Copy-Item $manifestBackup apps/docs/package.json -Force
          Copy-Item $workspaceConfigBackup pnpm-workspace.yaml -Force
          Copy-Item $lockfileBackup pnpm-lock.yaml -Force

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Locate Chrome
        run: |
          $chrome = Get-Command google-chrome -ErrorAction Stop
          "CHROME_PATH=$($chrome.Source)" >> $env:GITHUB_ENV

      - name: Run Visual Alpha runtime QA
        run: pnpm visual-alpha:runtime-qa

      - name: Run package consumer smoke test
        run: pnpm package-smoke

      - name: Regenerate evidence
        run: pnpm evidence
