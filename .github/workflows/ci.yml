name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test, Storybook, and package checks
    # A clean Linux checkout preserves the repository's committed LF endings,
    # so the format gate is independent of a contributor's Windows autocrlf
    # setting. The hosted image also includes Chrome for the WebGL runtime QA.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_AUTH_TOKEN: ${{ secrets.LK_PACKAGES_READ_TOKEN || github.token }}
    defaults:
      run:
        shell: pwsh
        working-directory: lk-design-system-3d

    steps:
      - name: Checkout LDS3D
        uses: actions/checkout@v7.0.0
        with:
          path: lk-design-system-3d
          persist-credentials: false

      - name: Run pinned LDS conformance
        id: lds_conformance
        uses: LK-Design-System/lk-design-system/.github/actions/lds-conformance@e37372d2660b4ac76dcd6ea4fda40dbdc6378b93
        with:
          profile: lds3d-ui
          root: lk-design-system-3d

      - name: Export pinned LDS conformance paths
        env:
          CONFORMANCE_CLI: ${{ steps.lds_conformance.outputs.cli }}
          CONFORMANCE_ROOT: ${{ steps.lds_conformance.outputs.lds_root }}
        run: |
          "LDS_CONFORMANCE_CLI=$env:CONFORMANCE_CLI" >> $env:GITHUB_ENV
          "LDS_CONFORMANCE_ROOT=$env:CONFORMANCE_ROOT" >> $env:GITHUB_ENV

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.17.1
          cache: pnpm
          cache-dependency-path: lk-design-system-3d/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@lk-robotics"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Locate Chrome
        run: |
          $chrome = Get-Command google-chrome -ErrorAction Stop
          "CHROME_PATH=$($chrome.Source)" >> $env:GITHUB_ENV

      - name: Run Visual Alpha runtime QA
        run: pnpm visual-alpha:runtime-qa

      - name: Run package consumer smoke test
        run: pnpm package-smoke

      - name: Regenerate evidence
        run: pnpm evidence
